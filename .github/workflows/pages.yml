name: Deploy converter page

# 把 web/ 作为纯静态站点发布到 GitHub Pages。
# 仓库需先在 Settings -> Pages -> Build and deployment 里把 Source 设为 "GitHub Actions"。
# 页面不需要构建：web/dicts.js 由 tools/build_web.py 生成并随仓库提交。
on:
  push:
    branches: [main, master]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
