name: Build dictionaries from upstream

# 本仓库不存放 1 MB 级的完整词表二进制文本；它们由本工作流从上游
# OpenCC 规范繁体仓库按《大陆标准繁体汉字海宁吴语修订方案》生成并提交。
# 生成规则集中在 tools/rules.py 与 rules/overrides.tsv。
# 生成完成后仓库即「clone 即用」：opencc/ 下含全部 json 与 txt 字典。

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone upstream tables
        run: |
          git clone --depth 1 \
            https://github.com/TerryTian-tech/OpenCC-Traditional-Chinese-characters-according-to-Chinese-government-standards.git \
            upstream-src
          echo "UPSTREAM_COMMIT=$(git -C upstream-src rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build revised tables
        run: python tools/build.py --upstream upstream-src/t2gov

      - name: Verify conversions
        run: |
          python -m pip install --quiet opencc
          python tools/verify.py

      - name: Commit generated dictionaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opencc rime doc/01-修订方案.md tests/cases.json
          if git diff --cached --quiet; then
            echo "Dictionaries are up to date. Nothing to commit."
            exit 0
          fi
          git commit -m "chore: rebuild dictionaries from upstream ${UPSTREAM_COMMIT} [skip ci]"
          git push
