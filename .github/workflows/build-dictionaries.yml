name: Build dictionaries from upstream

# 本仓库的 1 MB 级完整词表可由本地 tools/build.py 生成，也可由本工作流
# 从上游 OpenCC 规范繁体仓库按《大陆标准繁体汉字海宁吴语修订方案》生成并提交。
# 若仓库里已经包含完整字典（例如手工推送了本地构建结果），工作流只做校验。
# 生成规则集中在 tools/rules.py 与 rules/overrides.tsv。

on:
  push:
    branches: [main, master]
    paths:
      - 'tools/**'
      - 'rules/**'
      - '.github/workflows/build-dictionaries.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check whether dictionaries are already present
        id: check
        run: |
          if [ -f opencc/s2hn.json ] && [ -f opencc/STPhrases.txt ] && [ -f opencc/TGPhrases.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone upstream tables
        if: steps.check.outputs.present != 'true'
        run: |
          git clone --depth 1 \
            https://github.com/TerryTian-tech/OpenCC-Traditional-Chinese-characters-according-to-Chinese-government-standards.git \
            upstream-src
          echo "UPSTREAM_COMMIT=$(git -C upstream-src rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build revised tables
        if: steps.check.outputs.present != 'true'
        run: python tools/build.py --upstream upstream-src/t2gov

      - name: Verify conversions
        run: |
          python -m pip install --quiet opencc
          python tools/verify.py
          python tools/make_web_corpus.py
          node tools/verify_web.mjs

      - name: Commit generated dictionaries
        if: steps.check.outputs.present != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opencc rime doc/01-修订方案.md tests/cases.json tests/web_corpus.json web/dicts.js
          if git diff --cached --quiet; then
            echo "Dictionaries are up to date. Nothing to commit."
            exit 0
          fi
          git commit -m "chore: rebuild dictionaries from upstream ${UPSTREAM_COMMIT} [skip ci]"
          git push
